<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>Markdown to Word Converter (Full)</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      max-width: 800px;
    }

    textarea {
      width: 100%;
      height: 300px;
      margin-bottom: 10px;
      font-family: monospace;
      font-size: 14px;
      padding: 10px;
      box-sizing:
        border-box;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      background-color: #0078d4;
      color: white;
      border: none;
      border-radius:
        4px;
    }

    button:hover {
      background-color: #005a9e;
    }
  </style>
</head>

<body>

  <h1>Markdown → Word 変換 (テーブル・番号付きリスト対応)</h1>
  <textarea id="markdownInput" placeholder="ここにMarkdownを入力してください...">
# 1. サンプルドキュメント

これはテストです。**太字** や *斜体* が使えます。

## 2. リストのテスト
- 通常の箇条書き1
- 通常の箇条書き2

1. 番号付きリストの1番目
2. 番号付きリストの2番目

## 3. 表（テーブル）のテスト

| 商品名 | 価格 | 備考 |
| :--- | :--- | :--- |
| りんご | 150円 | 青森県産 |
| バナナ | 200円 | フィリピン産 |
| メロン | 1,200円 | 高級品 |

# 2. Mermaidダイアグラムのテスト

```mermaid
flowchart TB
    A[起床] --> B[顔を洗う] -->
    C{眠い?} -- 眠くない --> D[朝食を食べる]
    C{眠い?} -- 眠い --> E[二度寝する] -- 起きる --> C{眠い?}
    D[朝食を食べる] --> 
    F[歯を磨く] -->
    G((やっぱり寝る))
```

</textarea>

  <br>
  <button id="downloadBtn">Wordファイルを出力する</button>

  <script type='module'>

import * as docx from 'https://cdn.jsdelivr.net/npm/docx@9.7.1/+esm';
import * as marked from 'https://cdn.jsdelivr.net/npm/marked@18.0.14/+esm';
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/+esm';

// Mermaidの初期設定
mermaid.initialize({
  startOnLoad: false,
  theme: 'default',
  securityLevel: 'loose'
});

const downloadBtn = document.getElementById('downloadBtn');

downloadBtn.addEventListener('click', async () => {
  const mdText = document.getElementById('markdownInput').value;
  if (!mdText.trim()) {
    alert('Markdownを入力してください。');
    return;
  }

  downloadBtn.disabled = true;
  downloadBtn.textContent = '変換中...';

  try {
    const wordChildren = [];
    let mermaidCounter = 0;

    // ```mermaid ... ``` を抽出する正規表現
    const mermaidRegex = /```mermaid\s*\n?([\s\S]*?)```/gi;
    let lastIndex = 0;
    let match;

    while ((match = mermaidRegex.exec(mdText)) !== null) {
      // 直前のテキスト部分をマークダウン処理
      const textBefore = mdText.substring(lastIndex, match.index);
      if (textBefore.trim()) {
        const tokens = marked.lexer(textBefore);
        appendTokensToWord(tokens, wordChildren);
      }

      // Mermaidブロックの処理
      const mermaidCode = match[1].trim();
      mermaidCounter++;
      
      try {
        const imageData = await renderMermaidToPng(mermaidCode, `mermaid-${mermaidCounter}-${Date.now()}`);
        
        // ImageRunの正しい追加設定（破損エラーとアスペクト比崩れを防止）
        wordChildren.push(new docx.Paragraph({
          children: [
            new docx.ImageRun({
              data: imageData.arrayBuffer,
              transformation: {
                width: imageData.width,
                height: imageData.height
              },
              type: 'png'
            })
          ],
          spacing: { before: 120, after: 120 },
          alignment: docx.AlignmentType.CENTER
        }));
      } catch (err) {
        console.error('Mermaidレンダリングエラー:', err);
        wordChildren.push(new docx.Paragraph({
          children: [new docx.TextRun({ text: `[Mermaid描画エラー]\n${mermaidCode}`, color: 'FF0000' })],
          spacing: { after: 120 }
        }));
      }

      lastIndex = mermaidRegex.lastIndex;
    }

    // 残りのテキスト部分を追加
    const remainingText = mdText.substring(lastIndex);
    if (remainingText.trim()) {
      const tokens = marked.lexer(remainingText);
      appendTokensToWord(tokens, wordChildren);
    }

    if (wordChildren.length === 0) {
      wordChildren.push(new docx.Paragraph("（本文がありません）"));
    }

    // Wordドキュメント作成
    const doc = new docx.Document({
      numbering: {
        config: [
          {
            reference: "ordered-list-style",
            levels: [
              {
                level: 0,
                format: docx.NumberFormat.DECIMAL,
                text: "%1.",
                alignment: docx.AlignmentType.LEFT,
              },
            ],
          },
        ],
      },
      sections: [{
        properties: {},
        children: wordChildren
      }]
    });

    // ダウンロード処理
    const blob = await docx.Packer.toBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'markdown_mermaid_export.docx';
    a.click();
    URL.revokeObjectURL(url);

  } catch (error) {
    console.error("変換エラー:", error);
    alert("Wordファイルの生成中にエラーが発生しました。");
  } finally {
    downloadBtn.disabled = false;
    downloadBtn.textContent = 'Wordファイルを出力する';
  }
});

// マークダウントークンをWord要素へ変換
function appendTokensToWord(tokens, wordChildren) {
  for (const token of tokens) {
    if (token.type === 'heading') {
      wordChildren.push(new docx.Paragraph({
        text: token.text,
        heading: docx.HeadingLevel[`HEADING_${token.depth}`] || docx.HeadingLevel.HEADING_1,
        spacing: { before: 240, after: 120 }
      }));
    } else if (token.type === 'code') {
      wordChildren.push(new docx.Paragraph({
        children: [new docx.TextRun({ text: token.text, font: 'Consolas' })],
        spacing: { after: 120 }
      }));
    } else if (token.type === 'paragraph') {
      wordChildren.push(new docx.Paragraph({
        children: parseInlineTokens(token.tokens),
        spacing: { after: 120 }
      }));
    } else if (token.type === 'list') {
      token.items.forEach(item => {
        if (token.ordered) {
          wordChildren.push(new docx.Paragraph({
            children: parseInlineTokens(item.tokens),
            numbering: { reference: "ordered-list-style", level: 0 },
            spacing: { after: 60 }
          }));
        } else {
          wordChildren.push(new docx.Paragraph({
            children: parseInlineTokens(item.tokens),
            bullet: { level: 0 },
            spacing: { after: 60 }
          }));
        }
      });
    } else if (token.type === 'table') {
      const tableRows = [];
      tableRows.push(new docx.TableRow({
        children: token.header.map(cell => new docx.TableCell({
          children: [new docx.Paragraph({ children: parseInlineTokens(cell.tokens), bold: true })],
          shading: { fill: "F2F2F2" },
          padding: { top: 100, bottom: 100, left: 150, right: 150 }
        }))
      }));
      token.rows.forEach(row => {
        tableRows.push(new docx.TableRow({
          children: row.map(cell => new docx.TableCell({
            children: [new docx.Paragraph({ children: parseInlineTokens(cell.tokens) })],
            padding: { top: 100, bottom: 100, left: 150, right: 150 }
          }))
        }));
      });
      wordChildren.push(new docx.Table({
        rows: tableRows,
        margin: { top: 100, bottom: 100, left: 150, right: 150 },
        width: { size: 100, type: docx.WidthType.PERCENTAGE }
      }));
      wordChildren.push(new docx.Paragraph({ spacing: { after: 120 } }));
    }
  }
}

// インライン要素の解析
function parseInlineTokens(inlineTokens) {
  if (!inlineTokens) return [];
  return inlineTokens.map(token => {
    if (token.type === 'strong') {
      return new docx.TextRun({ text: token.text, bold: true });
    } else if (token.type === 'em') {
      return new docx.TextRun({ text: token.text, italics: true });
    } else if (token.type === 'text') {
      return new docx.TextRun({ text: token.text });
    }
    return new docx.TextRun({ text: token.text || token.raw || '' });
  });
}

/**
 * viewBoxから正確な縦横比を安全に計算し、Word破損を防ぐPNG変換処理
 */
async function renderMermaidToPng(code, id) {
  let renderArea = document.getElementById('mermaidRenderArea');
  if (!renderArea) {
    renderArea = document.createElement('div');
    renderArea.id = 'mermaidRenderArea';
    // 正確な getBoundingClientRect()/viewBox 読み取りのために画面外に置く
    renderArea.style.position = 'fixed';
    renderArea.style.left = '-9999px';
    renderArea.style.top = '-9999px';
    renderArea.style.opacity = '0';
    document.body.appendChild(renderArea);
  }
  renderArea.innerHTML = '';

  // SVGの描画
  const { svg } = await mermaid.render(id, code);
  renderArea.innerHTML = svg;

  const svgElement = renderArea.querySelector('svg');
  
  // 1. viewBoxから正確な幅・高さとアスペクト比を取得（縦長潰れ対策）
  let width = 600;
  let height = 400;

  const viewBox = svgElement.getAttribute('viewBox');
  if (viewBox) {
    const parts = viewBox.split(/[\s,]+/).map(Number);
    if (parts.length === 4 && parts[2] > 0 && parts[3] > 0) {
      width = parts[2];
      height = parts[3];
    }
  } else {
    width = parseFloat(svgElement.getAttribute('width')) || svgElement.getBoundingClientRect().width || 600;
    height = parseFloat(svgElement.getAttribute('height')) || svgElement.getBoundingClientRect().height || 400;
  }

  // Word本文幅（最大 480pt）に合わせてアスペクト比を維持して縮小・拡大設定
  const maxWidth = 480;
  if (width > maxWidth) {
    height = (height * maxWidth) / width;
    width = maxWidth;
  }

  // 小数点を四角形計算でのXML破損防止用に整数化
  width = Math.round(width);
  height = Math.round(height);

  // 高画質化（2倍高解像度）
  const scale = 2;
  const canvas = document.createElement('canvas');
  canvas.width = width * scale;
  canvas.height = height * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // 背景を白塗り
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, width, height);

  // SVG要素に明示的に width/height を付与してCanvas描画の歪みをなくす
  svgElement.setAttribute('width', width);
  svgElement.setAttribute('height', height);

  const svgString = new XMLSerializer().serializeToString(svgElement);
  const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);

  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      ctx.drawImage(img, 0, 0, width, height);

      try {
        const dataURI = canvas.toDataURL('image/png');
        const byteString = atob(dataURI.split(',')[1]);
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
          ia[i] = byteString.charCodeAt(i);
        }

        resolve({
          arrayBuffer: ia,
          width: width,
          height: height
        });
      } catch (e) {
        reject(e);
      }
    };
    img.onerror = () => {
      reject(new Error('SVG画像の読み込みに失敗しました。'));
    };
    img.src = dataUrl;
  });
}

  </script>
</body>

</html>
